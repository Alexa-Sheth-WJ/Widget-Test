.ttl{margin-left:auto;text-align:right;min-width:0}
.ttl h1{font-size:clamp(15px,4.3cqw,21px);font-weight:600;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}

/* totals */
.stats{flex:none;display:flex;align-items:center;gap:clamp(10px,3cqw,16px)}
.badge{width:clamp(40px,11cqw,56px);aspect-ratio:1;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(232,63,85,.45)}
.hero{display:flex;flex-direction:column;min-width:0}
.hn{font-size:clamp(24px,7.4cqw,36px);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hl{font-size:clamp(10.5px,2.6cqw,12.5px);color:var(--muted);line-height:1.25;margin-top:3px}
.sec{display:flex;flex-direction:column;padding-left:clamp(10px,3cqw,16px);border-left:1px solid var(--line);min-width:0}
.sec b{font-size:clamp(16px,4.4cqw,21px);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.sec span{font-size:clamp(10px,2.4cqw,11.5px);color:var(--muted);line-height:1.25}

/* personal */
.me{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:8px 10px 8px 12px;box-shadow:inset 0 0 0 1.5px var(--accent)}
.me[hidden]{display:none}
.me .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:status 2s ease-in-out infinite}
@keyframes status{0%,100%{opacity:1}50%{opacity:.35}}
.me .tx{min-width:0;flex:1}
.me strong{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.me small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{flex:none;font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;min-height:30px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.q:focus-visible,.list:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* search */
.sbar{flex:none;display:flex;align-items:center;gap:8px}
.qwrap{position:relative;flex:1;min-width:0}
.qwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.q{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:7px 10px 7px 32px;min-height:36px;-webkit-appearance:none;appearance:none}
.q::placeholder{color:var(--muted);opacity:.85}
.count{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}

/* list */
.list{flex:1 1 0;min-height:56px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:10px;background:var(--surface-2);padding:0 10px 8px;scrollbar-width:thin}
.grp h2{position:sticky;top:0;z-index:1;background:var(--surface-2);font-size:12px;font-weight:600;padding:8px 0 4px;display:flex;justify-content:space-between;gap:8px}
.grp h2 span{color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.3}
.row .d{color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.mine{background:var(--mine);margin:0 -10px;padding:6px 10px;border-radius:6px;border-top-color:transparent}
.row.mine .n{font-weight:600}
.row.mine .n::after{content:" ★";color:var(--accent)}
mark{background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}
.empty{padding:18px 4px;font-size:13px;color:var(--muted);line-height:1.45}
.empty b{color:var(--ink);font-weight:600}
.more{height:1px}

@container frame (max-width: 399px){
  .row{grid-template-columns:1fr;gap:0}
  .row .d{text-align:left;font-size:12px}
  .sbar{flex-wrap:wrap;row-gap:4px}
  .count{width:100%}
}
@container frame (max-height: 420px){ .badge{display:none} }
@container frame (max-height: 330px){ .stats{display:none} }
@container frame (max-height: 260px){
  .count{display:none}
  .logo{display:none} .shield{display:block}
  .ttl h1{font-size:15px}
  .me{padding:5px 8px} .me small{display:none} .me .lead{display:none} .me strong{font-size:12.5px}
  .btn{padding:4px 9px;min-height:26px}
  .q{min-height:32px;padding-top:5px;padding-bottom:5px}
  .list{min-height:44px}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>

  for (let k = 0; k < n && vi < view.length; k++, vi++){
    const g = view[vi], el = document.createElement('div'); el.className = 'grp';
    const h = document.createElement('h2'); h.textContent = g.label;
    const c = document.createElement('span'); c.textContent = T.winners(g.rows.length); if (!terms.length && !onlyMine) h.appendChild(c); el.appendChild(h);
    g.rows.forEach(x => {
      const r = document.createElement('div'); r.className = 'row' + (myHash && x.h === myHash ? ' mine' : '');
      const d = document.createElement('span'); d.className = 'd'; d.textContent = x.d;
      r.append(hl(x.n), d); el.appendChild(r);
    });
    frag.appendChild(el);
  }
  list.insertBefore(frag, more);
}
function apply(){
  const raw = fold(q.value.trim());
  terms = raw ? raw.split(/\s+/).filter(Boolean) : [];
  view = []; let n = 0;
  periods.forEach(p => {
    const rows = p.people.filter(x => (!onlyMine || x.h === myHash) && terms.every(t => x.k.includes(t)));
    if (rows.length){ view.push({ label: p.label, rows }); n += rows.length; }
  });
  list.querySelectorAll('.grp,.empty').forEach(e => e.remove());
  vi = 0; list.scrollTop = 0;
  if (!n){
    const e = document.createElement('p'); e.className = 'empty'; e.innerHTML = T.empty();
    e.querySelector('b').textContent = '\u201c' + q.value.trim() + '\u201d'; list.insertBefore(e, more);
  } else batch(6);
  $('count').textContent = onlyMine ? T.mineShowing(n) : terms.length ? T.matches(n) : T.all(total);
}
let tmr; q.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(apply, 120); });
q.addEventListener('keydown', e => { if (e.key === 'Escape'){ q.value = ''; apply(); } });
apply();
if ('IntersectionObserver' in window){
  new IntersectionObserver(es => { if (es[0].isIntersecting) batch(8); }, { root: list, rootMargin: '300px' }).observe(more);
} else { list.addEventListener('scroll', () => { if (list.scrollTop + list.clientHeight > list.scrollHeight - 300) batch(8); }); }
</script>
</body>
</html>
